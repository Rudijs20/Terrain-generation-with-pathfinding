<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Pathfinder</title>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 100; }
    </style>

    <!-- Dont install the whole three.js but rather tell browser where to find it -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
<div id="ui" style="background: rgba(0,0,0,0.8); padding: 20px; border-radius: 8px; border: 1px solid #333; width: 320px;">
        <h2 style="margin-top: 0; text-align: center; color: #fff;">World Generator</h2>
        
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <label style="width: 48%;">Width: <input type="number" id="ui-width" value="100" style="width: 100%; box-sizing: border-box; background: #222; color: #fff; border: 1px solid #555; padding: 4px;"></label>
            <label style="width: 48%;">Height: <input type="number" id="ui-height" value="100" style="width: 100%; box-sizing: border-box; background: #222; color: #fff; border: 1px solid #555; padding: 4px;"></label>
        </div>

        <label style="display: block; margin-bottom: 15px;">
            <div style="display: flex; justify-content: space-between;">
                <span>Mountain Aggression</span>
                <span id="peaks-val" style="font-weight: bold; color: #4CAF50;">50</span>
            </div>
            <input type="range" id="ui-peaks" min="0" max="100" value="50" style="width: 100%; cursor: pointer;">
        </label>

        <label style="display: block; margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between;">
                <span>Sea Level (Water Size)</span>
                <span id="lakes-val" style="font-weight: bold; color: #2196F3;">20</span>
            </div>
            <input type="range" id="ui-lakes" min="0" max="80" value="20" style="width: 100%; cursor: pointer;">
        </label>

        <button id="generate-btn" style="width: 100%; padding: 10px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; font-weight: bold; margin-bottom: 10px;">Generate New World</button>
        
        <hr style="border-color: #333; margin-bottom: 10px;">
        
        <p id="status" style="font-size: 14px; margin-bottom: 10px; text-align: center;">Loading map data...</p>
        <button id="reset-btn" style="width: 100%; padding: 8px; cursor: pointer; background: #333; color: white; border: 1px solid #666; border-radius: 4px;">Clear Path</button>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
